[project]
name = "kingdom"
version = "0.1.0"
description = "Local-first control plane for AI-assisted software development"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.14.2",
    "mcp>=1.28.1",
]

[project.scripts]
kingdom-api = "kingdom.api.app:run"
kingdom-mcp = "kingdom.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "anyio>=4.7",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kingdom"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Vendored Claude Code skills are third-party; keep them out of our lint/format
# scope so `ruff check .` / `ruff format .` reflect Kingdom's own code only.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["kingdom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
